    <!-- === START CONTAINER CODE === -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.js"
    integrity="sha512-is1ls2rgwpFZyixqKFEExPHVUUL+pPkBEPw47s/6NDQ4n1m6T/ySeDW3p54jp45z2EJ0RSOgilqee1WhtelXfA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="text/javascript" charset="utf-8">
    // Global variable here
    const URL_IMAGE_SEVER_LOCAL = "http://192.168.0.201:1201/";  // Sesuaikan
    const URL_IMAGE_SEVER_WG = "http://11.11.17.2:1201/"; // Sesuaikan
    const IP_WG = "11.11.17.4"; // Sesuaikan

    // Vue components here
    Vue.component("ttd-section", {
        props: {
            mode: String,
            drawer_name: String,
            label: String,
            value: String,
            path_name: String,
            stroke: String,
            path_stroke: String,
            name_input_type: String,
            select_id: String,
        },
        mounted() {
            $(`#${this.select_id}`).on("select2:select", (e) => {
                const selected = e.params.data;

                if (selected) {
                    const url = selected.ttd_image ? this.getImageUrl() + selected.ttd_image : "";
                    this.onChangeTTD(url);
                }
            });

            $(`#${this.select_id}`).on("select2:clearing", (e) => {
                this.localValue = "";
                this.updateStrokeBaru("");
            });

            setSelect2(`#${this.select_id}`, this.value, this.value);
        },
        methods: {
            getImageUrl() {
                return window.location.hostname === IP_WG ? URL_IMAGE_SEVER_WG : URL_IMAGE_SEVER_LOCAL;
            },
            showImageUrl(url) {
                if (!url || typeof url !== "string" || url.trim() === "") {
                    console.warn("URL tidak valid atau kosong. Mengembalikan string kosong.");
                    return "";
                }

                try {
                    // 2. Gunakan objek URL untuk mendapatkan pathname
                    const urlObject = new URL(url);
                    const pathname = urlObject.pathname.startsWith("/")
                        ? urlObject.pathname.substring(1)
                        : urlObject.pathname;
                    const result = this.getImageUrl() + pathname + urlObject.search;
                    return result;
                } catch (e) {
                    console.error("Gagal memproses URL:", e);
                    // Mengembalikan URL asli jika terjadi kesalahan
                    return url;
                }
            },
            handleOpenTTDModal({ path_stroke, path_name, mode, label, name_input_type }) {
                this.$emit("open-ttd-modal", {
                    path_stroke,
                    path_name,
                    label,
                    name_input_type,
                    mode_ttd: mode,
                });
            },
            onChangeTTD(url = "") {
                if (this.mode === "IMAGE" && this.name_input_type === "TEXT") return;

                clearTimeout(this.debounceTimer);
                this.debounceTimer = setTimeout(() => {
                    if (this.localValue) {
                        let stroke = "";

                        if (this.mode === "QRCODE") {
                            stroke = generatorQr(this.localValue);
                        } else if (this.mode === "IMAGE") {
                            stroke = url;
                        } else {
                            return;
                        }

                        this.updateStrokeBaru(stroke);
                    } else {
                        this.updateStrokeBaru("");
                    }
                }, 500); // delay 500 ms
            },
            updateStrokeBaru(url) {
                // Memberi tahu parent untuk update stroke
                this.$emit("update-stroke", url);
            },
        },
        computed: {
            localValue: {
                get() {
                    return this.value;
                },
                set(val) {
                    this.$emit("input", val);
                },
            },
        },
        template: `
<div class="row justify-content-center align-items-center">
    <div class="col-md-12">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-12 text-center" style="height:40px">
                <p class="mb-0">{{ label }}</p>
            </div>

            <div class="col-md-12 text-center mb-2">
                <img v-if="mode === 'IMAGE'" :src="showImageUrl(stroke)" alt="TTD Image" class="ttd-img" onerror="this.src='/images/blank.png';" />
                <img v-else :src="stroke" alt="TTD Image" class="ttd-img" onerror="this.src='/images/blank.png';" />
            </div>

            <div v-if="mode === 'CANVAS'" class="col-md-12 text-center">
                <p class="mb-0">{{ localValue }}</p>
            </div>

            <div v-if="mode === 'IMAGE' || mode === 'QRCODE' || mode === ''" class="col-md-12 text-center" style="height:23px">
    		    </div>

            <div class="col-md-12 text-center" v-if="mode === 'CANVAS'">
                <button style="min-width: 230px;" type="button"
                class="btn"
                :class="{
                    'bg-success text-white': (stroke === '' && localValue === ''),
                    'bg-warning text-black': (stroke !== '' || localValue !== '')
                }"
                data-toggle="modal"
                data-target="#tandaTanganModal"
                @click="handleOpenTTDModal( { path_stroke, path_name, mode, label, name_input_type } )">
                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                &nbsp;&nbsp;
                {{ stroke === '' && localValue === '' ? 'Tambah' : 'Edit' }} Tanda Tangan
                </button>
            </div>

            <div class="col-md-12 text-center" v-if="mode !== 'CANVAS'">
                <input v-if="name_input_type === 'TEXT'" type="text" class="form-control" v-model="localValue" @input="onChangeTTD" />
                <!-- Jika mode bukan CANVAS, tampilkan input select (auto complete) -->
                <select v-if="name_input_type !== 'TEXT'" class="form-control" :id="select_id" style="width: 100%;"></select>
            </div>
        </div>
    </div>
</div>
`,
    });

    // Config function here
    function configDokter1(data) {
        return {
            element: "#dokter_auto1",
            url: "/api/emr/autocomplete?source_name=dokter",
            allowClear: true,
            query_params: {
                status: "",
                spesialisasi: "",
            },
            markup_template: function (repo) {
                return `<b>${repo.nama}</b>`;
            },
            selection_template: function (repo) {
                // tulis format string untuk label autocomplete
                var res = "";
                if (repo.id != "") {
                    res = repo.nama || data.ttd_data.dokter;
                    data.ttd_data.dokter = res;
                }

                return res;
            },
        };
    }

    function configNakes1(data) {
        return {
            element: "#nakes_auto1",
            url: "/api/emr/autocomplete?source_name=nakes",
            allowClear: true,
            query_params: {
                status: "",
                id_profesi_nakes: "",
            },

            markup_template: function (repo) {
                return `<b>${repo.nama}</b>`;
            },
            selection_template: function (repo) {
                // tulis format string untuk label autocomplete
                var res = "";
                if (repo.id != "") {
                    res = repo.nama || data.ttd_data.perawat;
                    data.ttd_data.perawat = res;
                }

                return res;
            },
        };
    }

    function configRuang(data) {
        return {
            element: "#ruang_auto",
            url: "/api/emr/autocomplete?source_name=ruang",
            markup_template: function (repo) {
                return `<b>${repo.nama_bangsal}</b> - Ruang ${repo.nama_ruang}  <small>(${repo.nama_kelas})</small>`;
            },
            allowClear: true,
            selection_template: function (repo) {
                // tulis format string untuk label autocomplete

                // Previous Code : Bug when edit doc
                // data.pasien.ruang = repo.nama
                var data_test = {
                    nama_bangsal: repo.nama_bangsal || data.pasien.bangsal,
                    nama_ruang: repo.nama_ruang || data.pasien.ruang,
                    nama_kelas: repo.nama_kelas || data.pasien.kelas,
                }; // res = repo.nama ;

                data.pasien.bangsal = data_test.nama_bangsal;
                data.pasien.ruang = data_test.nama_ruang;
                data.pasien.kelas = data_test.nama_kelas;

                if (repo.text === "Pilih" && repo.id === "" && data_test.nama_bangsal === "" && data_test.nama_ruang === "" && data_test.nama_kelas === "") {
                    data.pasien.bangsal = "";
                    data.pasien.ruang = "";
                    data.pasien.kelas = "";

                    return "Pilih Ruangan"
                } else {
                    return `${data_test.nama_bangsal} - Ruang ${data_test.nama_ruang} - ${data_test.nama_kelas}`;
                }
            },
        };
    }

    function configTTDModalDokter(data) {
        return {
            element: "#dokter_ttd_modal_auto",
            url: "/api/emr/autocomplete?source_name=dokter",
            // biar bisa ngetik dan search di modal
            dropdownParent: "#tandaTanganModal",
            allowClear: true,
            query_params: {
                status: "",
                spesialisasi: "",
            },
            markup_template: function (repo) {
                return `<b>${repo.nama}</b>`;
            },
            selection_template: function (repo) {
                // tulis format string untuk label autocomplete
                var res = "";
                if (repo.id != "") {
                    res = repo.nama || data.tmp_modal_ttd.name;
                    data.tmp_modal_ttd.name = res;
                }

                return res;
            },
        };
    }

    function configTTDModalNakes(data) {
        return {
            element: "#nakes_ttd_modal_auto",
            url: "/api/emr/autocomplete?source_name=nakes",
            // biar bisa ngetik dan search di modal
            dropdownParent: "#tandaTanganModal",
            allowClear: true,
            query_params: {
                status: "",
                id_profesi_nakes: "",
            },

            markup_template: function (repo) {
                return `<b>${repo.nama}</b>`;
            },
            selection_template: function (repo) {
                // tulis format string untuk label autocomplete
                var res = "";
                if (repo.id != "") {
                    res = repo.nama || data.tmp_modal_ttd.name;
                    data.tmp_modal_ttd.name = res;
                }

                return res;
            },
        };
    }

    function init_doc(doc_id, data, operation) {
        // Temporary state or variable here
        data.drawings = {
            ttd_1: { brushSize: 2, brushColor: "#000000", isDrawing: false, isErasing: false, lastX: 0, lastY: 0 },
        };

        data.tmp_modal_ttd = {
            name: "",
            title: "",
            label: "",
            mode: "",
            mode_ttd: "",
            path_name: "",
            path_stroke: "",
            name_input_type: "",
        };

        var app = new Vue({
            el: "#formadd",
            data: data,
            mounted: function () {
                this.init();

                this.$nextTick(() => {
                    document.querySelectorAll("textarea").forEach(autoGrow);
                });
            },
            methods: {
                init: function () {
                    // Autocomplete function here
                    autocomplete(configRuang(data));
                    autocomplete(configDokter1(data));
                    autocomplete(configNakes1(data));
                    this.setupSignature(data);

                    $('#ruang_auto').on('select2:clearing', function (e) {
                        data.pasien.bangsal = "";
                        data.pasien.ruang = "";
                        data.pasien.kelas = "";
                    });

                    if (operation === "add") {
                        init_doc_add(data);
                    }
                    if (operation === "edit") {
                        init_doc_edit(data);
                    }
                },
                saveDoc: function () {
                    var json = {
                        document_history_list_id: doc_id /* built in variable from edoc */,
                        patient_id: EMRDATA.patient_id,
                        reg_number: EMRDATA.reg_number,
                        document: EMRDATA.document_code,
                        document_title: EMRDATA.document_name,
                        label: "Poliklinik",
                        note: "",
                        data: sanitizeData(data, '`')
                    };

                    /* built in function from edoc */
                    save_emr_data(json);
                },
                checkData: function () {
                    /* built in function from edoc */
                    preview_emr_data(data);
                },
                onChDateDynamic: function (dateData, jsonPath) {
                    // @change="onChDateDynamic($event, 'penatalaksanaan.tanggal_indo')">
                    let obj = this;
                    jsonPathSplit = jsonPath.split(".");
                    for (i = 0; i < jsonPathSplit.length - 1; i++) {
                        obj = obj[jsonPathSplit[i]];
                    }
                    if (dateData.target.value != "") {
                        obj[jsonPathSplit[i]] = dateParse(new Date(dateData.target.value));
                    } else {
                        obj[jsonPathSplit[i]] = "";
                    }
                },
                setupSignature: function (data) {
                    $('[data-bs-toggle="tooltip"]').tooltip();
                    // Start setup Coretan Canvas
                    // const canvas1 = this.$refs["ttd_1"];
                    // this.addCanvasListeners("ttd_1", canvas1);

                    this.$nextTick(() => {
                        const canvas1 = this.$refs["ttd_1"];

                        if (!canvas1) {
                            console.warn("[setupSignature] canvas ttd_1 tidak ditemukan");
                            return;
                        }

                        this.addCanvasListeners("ttd_1", canvas1);
                    });
                    // End setup Coraten Canvas

                    // Start setup autocomplete ketika mode ttd canvas
                    $("#tandaTanganModal").on("shown.bs.modal", () => {
                        autocomplete(configTTDModalDokter(data));
                        autocomplete(configTTDModalNakes(data));
                        setSelect2("#dokter_ttd_modal_auto", data.tmp_modal_ttd.name, data.tmp_modal_ttd.name);
                        setSelect2("#nakes_ttd_modal_auto", data.tmp_modal_ttd.name, data.tmp_modal_ttd.name);

                        $("#dokter_ttd_modal_auto").on("select2:clearing", (e) => {
                            this.tmp_modal_ttd.name = "";
                            this.tmp_modal_ttd.stroke = "";
                        });

                        $("#nakes_ttd_modal_auto").on("select2:clearing", (e) => {
                            this.tmp_modal_ttd.name = "";
                            this.tmp_modal_ttd.stroke = "";
                        });
                    });
                    // End setup autocomplete ketika mode ttd canvas
                },
                addCanvasListeners(name, canvas) {
                    if (!canvas) {
                        console.warn(`[addCanvasListeners] canvas ${name} undefined`);
                        return;
                    }

                    canvas.addEventListener("mousedown", (e) => this.startDraw(e, name));
                    canvas.addEventListener("mousemove", (e) => this.moveDraw(e, name));
                    canvas.addEventListener("mouseup", () => this.stopDraw(name));
                    canvas.addEventListener("mouseout", () => this.stopDraw(name));
                    canvas.addEventListener("touchstart", (e) => this.startDraw(e, name));
                    canvas.addEventListener("touchmove", (e) => this.moveDraw(e, name));
                    canvas.addEventListener("touchend", () => this.stopDraw(name));
                },
                getCoordinates(event, canvas) {
                    const rect = canvas.getBoundingClientRect();
                    if (event.touches) {
                        return { x: event.touches[0].clientX - rect.left, y: event.touches[0].clientY - rect.top };
                    }
                    return { x: event.offsetX, y: event.offsetY };
                },
                startDraw(event, name) {
                    event.preventDefault();
                    const canvas = this.$refs[name];
                    const drawing = this.drawings[name];
                    drawing.isDrawing = true;
                    const { x, y } = this.getCoordinates(event, canvas);
                    drawing.lastX = x;
                    drawing.lastY = y;
                },
                moveDraw(event, name) {
                    const canvas = this.$refs[name];
                    const drawing = this.drawings[name];
                    if (!drawing.isDrawing) return;
                    event.preventDefault();
                    const ctx = canvas.getContext("2d");
                    ctx.lineWidth = drawing.brushSize;
                    ctx.strokeStyle = drawing.isErasing ? "rgba(255, 255, 255, 1)" : drawing.brushColor;
                    ctx.globalCompositeOperation = drawing.isErasing ? "destination-out" : "source-over";
                    ctx.lineJoin = "round";
                    ctx.lineCap = "round";

                    const { x, y } = this.getCoordinates(event, canvas);
                    ctx.beginPath();
                    ctx.moveTo(drawing.lastX, drawing.lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    drawing.lastX = x;
                    drawing.lastY = y;
                },
                stopDraw(name) {
                    this.drawings[name].isDrawing = false;
                },
                startDrawing(name) {
                    this.drawings[name].isErasing = false;
                },
                startErasing(name) {
                    this.drawings[name].isErasing = true;
                },
                clearCanvas(name, showConfirm = true) {
                    if (showConfirm) {
                        Swal.fire({
                            title: "Apa kamu yakin?",
                            text: "Anda tidak akan dapat mengembalikan ini!",
                            icon: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#3085d6",
                            cancelButtonColor: "#d33",
                            confirmButtonText: "Ya, hapus!",
                        }).then((result) => {
                            if (result.isConfirmed || result.value) {
                                setByPath(this, this.tmp_modal_ttd.path_stroke, "");
                                const canvas = this.$refs[name];
                                const ctx = canvas.getContext("2d");
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                Swal.fire({
                                    icon: "success",
                                    title: "Coretan Anda telah dihapus",
                                    showConfirmButton: false,
                                    timer: 1000,
                                });
                            }
                        });
                    } else {
                        const canvas = this.$refs[name];
                        const ctx = canvas.getContext("2d");
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                },
                saveAsImage({ name, path_name, path_stroke, isReturn = false }) {
                    if (this.tmp_modal_ttd.mode_ttd === "QRCODE") {
                        if (isReturn) return generatorQr(this.drawer_ttd[name].name);
                        else setByPath(this, path_stroke, generatorQr(getByPath(this, path_name)));
                    } else if (this.tmp_modal_ttd.mode_ttd === "CANVAS") {
                        const scaleFactor = 1; // Faktor skala, bisa diatur sesuai kebutuhan
                        const drawingCanvas = this.$refs[name];

                        // Buat canvas baru untuk menampung hasil
                        const resizedCanvas = document.createElement("canvas");
                        resizedCanvas.width = drawingCanvas.width * scaleFactor;
                        resizedCanvas.height = drawingCanvas.height * scaleFactor;

                        const resizedCtx = resizedCanvas.getContext("2d");

                        // Skalakan gambar latar belakang dan coretan ke canvas yang lebih kecil
                        resizedCtx.drawImage(drawingCanvas, 0, 0, resizedCanvas.width, resizedCanvas.height);

                        // Konversi hasilnya menjadi PNG base64
                        const resizedBase64 = resizedCanvas.toDataURL("image/png");

                        // Menyimpan hasil base64 ke array `drawings`
                        if (isReturn) return resizedBase64;
                        else setByPath(this, path_stroke, resizedBase64);
                    }
                },
                // Fungsi untuk memuat gambar dari base64 ke canvas
                loadBase64Image(base64 = null) {
                    const drawingCanvas = this.$refs["ttd_1"];
                    const drawingCtx = drawingCanvas.getContext("2d");

                    const drawingImage = new Image();
                    drawingImage.src = base64; // Muat gambar dari base64 di array drawings

                    drawingImage.onload = () => {
                        drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                        drawingCtx.drawImage(drawingImage, 0, 0, drawingCanvas.width, drawingCanvas.height);
                    };
                },
                openTTDModalHandler: function ({
                    path_name = "",
                    path_stroke = "",
                    mode_ttd = "",
                    label = "Penandatangan",
                    name_input_type = "TEXT",
                }) {
                    this.clearCanvas("ttd_1", false);
                    this.tmp_modal_ttd.name = "";
                    const stroke = getByPath(this, path_stroke);
                    this.tmp_modal_ttd.name = getByPath(this, path_name);
                    this.tmp_modal_ttd.name_input_type = name_input_type;
                    this.tmp_modal_ttd.label = label;
                    this.tmp_modal_ttd.path_name = path_name;
                    this.tmp_modal_ttd.path_stroke = path_stroke;
                    this.tmp_modal_ttd.mode_ttd = mode_ttd;

                    if (stroke || this.tmp_modal_ttd.name) this.tmp_modal_ttd.mode = "edit";
                    else this.tmp_modal_ttd.mode = "add";

                    if (this.tmp_modal_ttd.mode === "add") {
                        this.tmp_modal_ttd.title = "Tambah Tanda Tangan";
                    } else if (this.tmp_modal_ttd.mode === "edit") {
                        setSelect2("#dokter_ttd_modal_auto", this.tmp_modal_ttd.name, this.tmp_modal_ttd.name);
                        this.tmp_modal_ttd.title = "Edit Tanda Tangan";
                        this.loadBase64Image(getByPath(this, path_stroke));
                    }
                },
                saveTTDHandler: function (isAutoComplete = false) {
                    const drawingCanvas = this.$refs["ttd_1"];

                    setByPath(this, this.tmp_modal_ttd.path_name, this.tmp_modal_ttd.name);

                    if (!isCanvasBlank(drawingCanvas) || this.tmp_modal_ttd.mode_ttd === "QRCODE") {
                        this.saveAsImage({
                            name: "ttd_1",
                            path_name: this.tmp_modal_ttd.path_name,
                            path_stroke: this.tmp_modal_ttd.path_stroke,
                        });
                    }

                    this.tmp_modal_ttd = {
                        name: "",
                        title: "",
                        label: "",
                        mode: "",
                        mode_ttd: "",
                        path_name: "",
                        path_stroke: "",
                        name_input_type: "",
                    };
                },
            },
        });
    }

    function init_doc_add(data) {
        // Call bridging function here
        executeAllSafely([
            {
                label: "Setup Auto",
                functionName: setupAuto,
                parameters: [data]
            },
            {
                label: "Bridging Dokter DPJP",
                functionName: bridgingDokterDPJP,
                parameters: [data]
            },
            {
                label: "Bridging Patient Data",
                functionName: bridgingPatientData,
                parameters: [data]
            },
            {
                label: "Bridging Inpatient Information",
                functionName: bridgingInpatientInformation,
                parameters: [data]
            },
        ]);
    }

    function init_doc_edit(data) {
        // Call bridging function here
        executeAllSafely([
            {
                label: "Bridging Patient Data [EDIT]",
                functionName: bridgingPatientData,
                parameters: [data]
            },
            {
                label: "Bridging Inpatient Information [EDIT]",
                functionName: bridgingInpatientInformation,
                parameters: [data, "edit"]
            },
        ]);
    }

    // Bridging function here
    function setupAuto(data) {
        // Sesuaikan data disini
        data.ttd_data.jam = timeNow().time; // Jam sekarang

    // Custom and another function here
    function executeAllSafely(tasks = []) {
        if (!Array.isArray(tasks)) {
            console.error("executeAllSafely membutuhkan array.");
            return;
        }

        tasks.forEach(task => {
            executeSafely(task);
        });
    }

    function executeSafely({
        label,
        functionName,
        parameters = [],
        context = null,
        throwError = false
    }) {
        try {

            // Validasi: memastikan target benar-benar sebuah function
            if (typeof functionName !== "function") {
                throw new Error(`Target bukan function pada label: ${label}`);
            }

            // Eksekusi function:
            // Jika ada context → pakai apply() supaya 'this' tetap terikat
            // Jika tidak ada context → panggil normal dengan spread parameter
            const result = context
                ? functionName.apply(context, parameters)
                : functionName(...parameters);

            // Log jika berhasil
            console.info(`✅[SUCCESS] ${label}`);

            // Kembalikan hasil asli dari function
            return result;

        } catch (error) {

            // Log error dengan grouping agar rapi di console
            console.group(`❌ [ERROR] ${label}`);
            console.error("Message:", error.message);
            // console.error("Stack:", error.stack);      // Aktifkan jika perlu debug lebih detail
            // console.error("Arguments:", parameters);   // Aktifkan jika perlu cek parameter
            console.groupEnd();

            // Jika ingin error tetap dilempar ke luar (opsional)
            if (throwError) {
                throw error;
            }

            // Jika terjadi error, kembalikan null agar tidak memutus alur program
            return null;
        }
    }

    function dateParse(date) {
        const monthNames = [
            "Januari",
            "Februari",
            "Maret",
            "April",
            "Mei",
            "Juni",
            "Juli",
            "Agustus",
            "September",
            "Oktober",
            "November",
            "Desember",
        ];
        let dateInput = date;
        const yyyy = dateInput.getFullYear();
        let mm = dateInput.getMonth() + 1; // Months start at 0!
        let dd = dateInput.getDate();
        let month = monthNames[mm - 1];

        if (dd < 10) dd = "0" + dd;
        if (mm < 10) mm = "0" + mm;

        // dateInput = `${yyyy}-${mm}-${dd}`;
        let dateDisplay = `${dd} ${month} ${yyyy}`;
        // return {dateInput, dateDisplay}
        return dateDisplay;
    }

    function dateTimeParse(dateString) {
        // Mengubah string menjadi objek Date
        let dateInput = new Date(dateString);

        // Mendapatkan bagian tanggal
        const yyyy = dateInput.getFullYear();
        let mm = dateInput.getMonth() + 1; // Bulan dimulai dari 0, jadi tambahkan 1
        let dd = dateInput.getDate();

        // Daftar nama bulan
        const monthNames = [
            "Januari",
            "Februari",
            "Maret",
            "April",
            "Mei",
            "Juni",
            "Juli",
            "Agustus",
            "September",
            "Oktober",
            "November",
            "Desember",
        ];

        // Menambahkan leading zero jika diperlukan
        if (dd < 10) dd = "0" + dd;
        if (mm < 10) mm = "0" + mm; // Menambahkan leading zero untuk bulan jika kurang dari 10

        // Format tanggal biasa (yyyy-mm-dd)
        let dateDisplay = `${yyyy}-${mm}-${dd}`;

        // Format tanggal dengan nama bulan (dd NamaBulan yyyy)
        let dateWithMonthName = `${dd} ${monthNames[mm - 1]} ${yyyy}`; // Indeks bulan di array dimulai dari 0

        // Mendapatkan bagian waktu
        let hours = dateInput.getHours();
        let minutes = dateInput.getMinutes();

        // Menambahkan leading zero jika diperlukan untuk waktu
        if (hours < 10) hours = "0" + hours;
        if (minutes < 10) minutes = "0" + minutes;

        // Format waktu dalam format 24 jam (hh:mm)
        let timeDisplay = `${hours}:${minutes}`;

        // Mengembalikan objek dengan tanggal, waktu, dan tanggal dengan nama bulan
        return { date: dateDisplay, time: timeDisplay, dateWithMonthName: dateWithMonthName };
    }

    function generatorQr(el) {
        let elgenerateqr = document.createElement("div");
        elgenerateqr.id = "elgenerateqr";

        let objqrcode = new QRCode(elgenerateqr, el);
        return elgenerateqr.querySelector("canvas").toDataURL();
    }

    function getByPath(obj, path) {
        return path
            .replace(/\[(\d+)\]/g, ".$1") // Ubah [0] jadi .0
            .split(".") // Pisahkan dengan titik
            .reduce((acc, part) => acc && acc[part], obj);
    }

    function setByPath(obj, path, value) {
        const parts = path.replace(/\[(\d+)\]/g, ".$1").split(".");
        let current = obj;

        for (let i = 0; i < parts.length - 1; i++) {
            const part = parts[i];
            if (!(part in current)) {
                // otomatis buat objek/array baru jika belum ada
                current[part] = isNaN(Number(parts[i + 1])) ? {} : [];
            }
            current = current[part];
        }

        current[parts[parts.length - 1]] = value;
    }

    function isCanvasBlank(canvas) {
        const context = canvas.getContext("2d");
        const pixelBuffer = new Uint32Array(context.getImageData(0, 0, canvas.width, canvas.height).data.buffer);

        return !pixelBuffer.some((color) => color !== 0);
    }

    function getUrlHandler() {
        return window.location.hostname === IP_WG ? URL_IMAGE_SEVER_WG : URL_IMAGE_SEVER_LOCAL;
    }

    function showKelamin(code) {
        return code === "P" ? "Perempuan" : code === "L" ? "Laki-laki" : "Jenis kelamin tidak dikenal";
    }

    // Global autogrow mechanism for textareas
    function autoGrow(element) {
        // Set base height (setara dengan +/- 3 baris) agar tidak terlalu menciut
        element.style.height = "75px";
        // Sesuaikan tinggi dengan scrollHeight
        element.style.height = (element.scrollHeight + 2) + "px";
    }

    document.addEventListener("input", function (e) {
        if (e.target.tagName.toLowerCase() === "textarea") {
            autoGrow(e.target);
        }
    });

    function sanitizeData(data, replaceChar = ' ') {
        if (typeof data === 'string') {
            return data.replace(/'/g, replaceChar);
        } else if (Array.isArray(data)) {
            return data.map(item => sanitizeData(item, replaceChar));
        } else if (typeof data === 'object' && data !== null) {
            const sanitizedObject = {};
            for (const key in data) {
                if (data.hasOwnProperty(key)) {
                    sanitizedObject[key] = sanitizeData(data[key], replaceChar);
                }
            }
            return sanitizedObject;
        } else {
            return data;
        }
    }
