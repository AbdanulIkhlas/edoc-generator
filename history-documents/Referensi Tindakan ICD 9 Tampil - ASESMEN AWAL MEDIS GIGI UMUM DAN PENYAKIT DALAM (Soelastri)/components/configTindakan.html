<script>
    function configTindakan(data) {
        return {
            element: '#tindakan_auto',
            url: '/api/emr/autocomplete?source_name=tindakan',
            query_params: {
                kelas: '',
                jenis_tindakan: '',
                jenis: '',
                id_penjamin: ''
            },
            markup_template: function (repo) {
                return `<b>${repo.layanan || ''}</b>`; // Default ke string kosong jika repo.layanan undefined
            },
            selection_template: function (repo) {
                // Jika `repo.layanan` ada, gunakan nilainya; fallback ke `data.tindakan_tmp.nama_layanan`
                if (repo && repo.layanan !== undefined) {
                    console.log("configTindakan : ", repo)
                    TINDAKAN_TMP = {
                        "nama_layanan": repo.layanan || "",
                        "icd_9_code": repo.code_icd9 || "",
                        "icd_9_name": repo.description_icd9 || ""
                    }
                } else {
                    TINDAKAN_TMP = {
                        "nama_layanan": "",
                        "icd_9_code": "",
                        "icd_9_name": ""
                    }
                }

                let result = ""

                if (repo.layanan === undefined) {
                    result = ""
                } else {
                    result = repo.layanan + " | ICD 9 : (" + repo.code_icd9 + ") " + repo.description_icd9
                }

                console.log("result : ", result)

                return result || "";
            }
        };
    }


    saveTindakan: function () {
            this.tindakan_freetext = "";
            let no = 1;
            this.external_link.tindakan_data_list.forEach((x, i) => {
                x.layanan.forEach((v, j) => {
                    if (this.index_expand_tindakan[i][j].selected) {
                        const tindak = this.external_link.tindakan_data_list[i].layanan[j];
                        const icd9 = (tindak.code_icd_9 || tindak.description_icd_9)
                            ? `(${tindak.code_icd_9}) ${tindak.description_icd_9}`
                            : '-';
                        this.tindakan_freetext += `${no}. ${tindak.nama_layanan} | ICD 9 : ${icd9}\n`;
                        no++;
                    }
                });
            });
            this.tindakan_freetext = this.tindakan_freetext.trim();
            $("#hasilTindakanModal").modal("toggle");
        },


</script>

<html>
<div>
    <div class="row">
        <div class="col-md-12">
            <label for="aspek_medis_tindakan_medis">
                <button v-if="external_link.tindakan_data_list.length > 1" type="button" title="Tindakan"
                    data-toggle="modal" data-target="#hasilTindakanModal" class="btn btn-info btn-sm">
                    Hasil tindakan
                </button>
            </label>
            <textarea class="form-control" id="aspek_medis_tindakan_medis" rows="3"
                v-model="tindakan_freetext"></textarea>
        </div>
    </div>
    <div class="row mt-1">
        <div class="col-md-12">
            <div class="row mb-2 justify-content-center">
                <div class="col-md-8 pr-0">
                    <select class="form-control" id="tindakan_auto" name="tindakan_auto" title="Tindakan"
                        style="width: 100%"></select>
                </div>
                <div class="col-md-4 text-right">
                    <button type="button" style="width: 100%; height: 100%" @click="addTindakan()"
                        class="btn btn-sm btn-success">
                        <i class="fa fa-plus"></i>
                        Tambah Data
                    </button>
                    &ensp;
                </div>
            </div>
        </div>
        <!-- perulangan untuk list tindakan -->
        <div class="col-md-12" v-for="(item, key) in tindakan_list" :key="key">
            <div class="row mb-2">
                <div class="col-md-8">
                    <div>
                        {{ key + 1 }}.
                        <!--&nbsp;{{ item.id_layanan }}&nbsp;-&nbsp;-->
                        <span v-html="item.nama_layanan"></span>
                        <span v-if="item.nama_layanan === 'Belum diketahui'">
                            Belum Di ketahui
                        </span>
                        <span v-if="item.icd_9_code !== ''">
                            | ICD 9 : ({{item.icd_9_code}}) {{item.icd_9_name}}
                        </span>
                        <span v-else>
                            | ICD 9 : -
                        </span>
                    </div>
                </div>
                <div class="col-md-4 text-left">
                    <button type="button" @click="deleteTindakan(key)" class="btn btn-sm btn-danger" title="Hapus3">
                        <i class="fa fa-trash"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>


<!--START TINDAKAN MODAL-->
<div class="modal fade" id="hasilTindakanModal" tabindex="-1" role="dialog" aria-labelledby="hasilTindakanModalTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Hasil Tindakan</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div>
                    <div class="mb-3" v-for="(jenisLayanan,i) in external_link.tindakan_data_list" :key="i">
                        <h6><u>{{jenisLayanan.jenis}} {{jenisLayanan.tanggal}} {{jenisLayanan.jam}}</u></h6>
                        <div v-for="(TindakanItem,j) in jenisLayanan.layanan" :key="j" class="mb-1 mx-2">
                            <div class="col-12 row justify-content-between px-3 rounded border-bottom font-weight-bold"
                                :class="{'bg-primary':index_expand_tindakan[i][j].expand, 'bg-light': !index_expand_tindakan[i][j].expand }">
                                <label style="cursor: pointer" :for="'customCheckTindakan'+i+j"
                                    class="nav-link col mb-0" :class="{'text-white':index_expand_tindakan[i][j].expand}"
                                    @click="navCollapse(i, j, 'index_expand_tindakan')">
                                    {{ TindakanItem.nama_layanan }}
                                    <span v-if="TindakanItem.code_icd_9 || TindakanItem.description_icd_9">
                                        | ICD 9 : ({{ TindakanItem.code_icd_9 }}) {{ TindakanItem.description_icd_9 }}
                                    </span>
                                    <span v-else>
                                        | ICD 9 : -
                                    </span>
                                </label>
                                <div class="nav-link">
                                    <div class="custom-control custom-checkbox">
                                        <input type="checkbox"
                                            @change="checkAllBridgingList('index_expand_tindakan', true)"
                                            class="custom-control-input" :id="'customCheckTindakan'+i+j"
                                            v-model="index_expand_tindakan[i][j].selected" />
                                        <label class="custom-control-label" :for="'customCheckTindakan'+i+j"></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="input-group mb-0"
                    style="display: flex; flex-wrap: nowrap; align-items: stretch; width: fit-content; height: 38px">
                    <div class="input-group-prepend">
                        <div class="input-group-text">
                            <input id="checkAllButtonTindakan" type="checkbox"
                                @change="checkAllBridgingList('index_expand_tindakan')"
                                v-model="index_expand_tindakan_check_all" />
                        </div>
                    </div>
                    <label for="checkAllButtonTindakan" class="form-check-label font-weight-bold rounded-right"
                        style="padding: 0.375rem 0.75rem; border: 1px solid #ced4da; display: flex; align-items: center; font-size: 16px">
                        Pilih semua
                    </label>
                </div>
                <button type="button" class="btn btn-primary" @click="saveTindakan">Simpan</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Tutup</button>
            </div>
        </div>
    </div>
</div>
<!--END TINDAKAN MODAL-->

</html>
