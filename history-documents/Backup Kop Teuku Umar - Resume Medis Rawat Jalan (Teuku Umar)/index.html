<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.js"
    integrity="sha512-is1ls2rgwpFZyixqKFEExPHVUUL+pPkBEPw47s/6NDQ4n1m6T/ySeDW3p54jp45z2EJ0RSOgilqee1WhtelXfA=="

<script type="text/javascript">
    /*
        Data sample ada di variable EMRDATA.init
    */
    // Global variable here
    let imageListData = [];

    const URL_IMAGE_SEVER_LOCAL = "http://192.168.100.200:1201/";
    const URL_IMAGE_SEVER_WG = "http://12.12.1.20:1201/";
    const IP_WG = "12.12.1.20";

    // Vue components here
    Vue.component('ttd-section', {
        props: {
            mode: String,
            drawer_name: String,
            label: String,
            value: String,
            path_name: String,
            stroke: String,
            path_stroke: String,
            name_input_type: String,
            select_id: String
        },
        mounted() {
            $(`#${this.select_id}`).on('select2:select', (e) => {
                const selected = e.params.data;

                if (selected) {
                    const url = selected.ttd_image ? this.getImageUrl() + selected.ttd_image : '';
                    this.onChangeTTD(url)
                }
            });

            $(`#${this.select_id}`).on('select2:clearing', (e) => {
                this.localValue = "";
                this.updateStrokeBaru("");
            });

            setSelect2(`#${this.select_id}`, this.value, this.value);
        },
        methods: {
            getImageUrl() {
                return window.location.hostname === IP_WG
                    ? URL_IMAGE_SEVER_WG
                    : URL_IMAGE_SEVER_LOCAL;
            },
            showImageUrl(url) {
                return this.getImageUrl() + url.split('/').pop();
            },
            handleOpenTTDModal({ path_stroke, path_name, mode, label, name_input_type }) {
                this.$emit('open-ttd-modal', {
                    path_stroke,
                    path_name,
                    label,
                    name_input_type,
                    mode_ttd: mode
                });
            },
            onChangeTTD(url = '') {
                clearTimeout(this.debounceTimer);
                this.debounceTimer = setTimeout(() => {
                    if (this.localValue) {
                        let stroke = '';

                        if (this.mode === 'QRCODE') {
                            stroke = generatorQr(this.localValue);
                        } else if (this.mode === 'IMAGE') {
                            stroke = url;
                        } else {
                            return;
                        }

                        this.updateStrokeBaru(stroke);
                    } else {
                        this.updateStrokeBaru("");
                    }
                }, 500); // delay 500 ms
            },
            updateStrokeBaru(url) {
                // Memberi tahu parent untuk update stroke
                this.$emit('update-stroke', url);
            }
        },
        computed: {
            localValue: {
                get() {
                    return this.value;
                },
                set(val) {
                    this.$emit('input', val);
                }
            }
        },
        template: `
	    <div class="row justify-content-center align-items-center">
		      <div class="col-md-12">
		          <div class="row justify-content-center align-items-center">
		              <div class="col-md-12 text-center" style="height:40px">
		                  <p class="mb-0">{{ label }}</p>
		              </div>
		
		              <div class="col-md-12 text-center mb-2">
		                  <img v-if="mode === 'IMAGE'" :src="showImageUrl(stroke)" alt="TTD Image" class="ttd-img" onerror="this.src='/images/blank.png';" />
		                  <img v-else :src="stroke" alt="TTD Image" class="ttd-img" onerror="this.src='/images/blank.png';" />
		              </div>
		
		              <div v-if="mode === 'CANVAS'" class="col-md-12 text-center">
		                  <p class="mb-0">{{ localValue }}</p>
		              </div>
		
		              <div v-if="mode === 'IMAGE' || mode === 'QRCODE'" class="col-md-12 text-center" style="height:23px">
		              </div>
		
		              <div class="col-md-12 text-center" v-if="mode === 'CANVAS'">
		                  <button style="min-width: 230px;" type="button"
		                  class="btn"
		                  :class="{
		                      'bg-success text-white': (stroke === '' && localValue === ''),
		                      'bg-warning text-black': (stroke !== '' || localValue !== '')
		                  }"
		                  data-toggle="modal"
		                  data-target="#tandaTanganModal"
		                  @click="handleOpenTTDModal( { path_stroke, path_name, mode, label, name_input_type } )">
		                  <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
		                  &nbsp;&nbsp;
		                  {{ stroke === '' && localValue === '' ? 'Tambah' : 'Edit' }} Tanda Tangan
		                  </button>
		              </div>
		
		              <div class="col-md-12 text-center" v-if="mode !== 'CANVAS'">
		                  <input v-if="name_input_type === 'TEXT'" type="text" class="form-control" v-model="localValue" @input="onChangeTTD" />
		                  <!-- Jika mode bukan CANVAS, tampilkan input select (auto complete) -->
		                  <select v-if="name_input_type !== 'TEXT'" class="form-control" :id="select_id" style="width: 100%;"></select>
		              </div>
		          </div>
		      </div>

                    res = (repo.icd_x + ' - ' + repo.deskripsi);

    function init_doc(doc_id, data, operation) {

        setupIndexExpand(data, "indexExpandTindakanUtama", "tindakan_data", false);

        // Temporary state or variable here
        data.drawings = {
            ttd_1: { brushSize: 2, brushColor: '#000000', isDrawing: false, isErasing: false, lastX: 0, lastY: 0 }
        }

        data.tmp_modal_ttd = {
            name: "",
            title: "",
            label: "",
            mode: "",
            mode_ttd: "",
            path_name: "",
            path_stroke: "",
            name_input_type: ""
        };

        var app = new Vue({
            el: '#formadd',
            data: data,
            mounted: function () {
                this.init()
            },
            methods: {
                init: function () {
                    autocomplete(configDiagnosa(data));
                    autocomplete(configTindakan(data));
                    autocomplete(configDokter(data));
                    autocomplete(configNakes(data));
                    this.setupSignature(data);

                    if (operation === 'add') {
                        init_doc_add(data);
                    }
                    if (operation === 'edit') {
                        init_doc_edit(data);
                    }


                    //alert(JSON.stringify(EMRDATA.init));

                },
                saveDoc: function () {
                    // const ttdTotal = 2; // Jumlah banyaknya TTD
                    // for (let i = 1; i <= ttdTotal; i++){
                    // 	imageListData.push(this.cetakImageTTDJasper(`ttd_${i}`));
                    // }
                    // this.terapi = $('#terapiObat').html()
                    var json = {
                        'document_history_list_id': doc_id, /* built in variable from edoc */
                        'patient_id': EMRDATA.patient_id,
                        'reg_number': EMRDATA.reg_number,
                        'document': EMRDATA.document_code,
                        'document_title': EMRDATA.document_name,
                        'label': 'Poliklinik',
                        'note': '',
                        'data': data,
                        // 'images_data' : imageListData
                    };

                    /* built in function from edoc */
                    save_emr_data(json);
                },
                setupSignature: function (data) {
                    $('[data-bs-toggle="tooltip"]').tooltip();
                    // Start setup Coretan Canvas
                    const canvas1 = this.$refs['ttd_1'];
                    this.addCanvasListeners('ttd_1', canvas1);
                    // End setup Coraten Canvas

                    // Start setup autocomplete ketika mode ttd canvas
                    $('#tandaTanganModal').on('shown.bs.modal', () => {
                        autocomplete(configTTDModalDokter(data));
                        autocomplete(configTTDModalNakes(data));
                        setSelect2("#dokter_ttd_modal_auto", data.tmp_modal_ttd.name, data.tmp_modal_ttd.name);
                        setSelect2("#nakes_ttd_modal_auto", data.tmp_modal_ttd.name, data.tmp_modal_ttd.name);
                    });
                    $('#dokter_ttd_modal_auto').on('select2:clearing', function (e) {
                        data.tmp_modal_ttd.name = "";
                        data.tmp_modal_ttd.stroke = ""
                    });
                    $('#nakes_ttd_modal_auto').on('select2:clearing', function (e) {
                        data.tmp_modal_ttd.name = "";
                        data.tmp_modal_ttd.stroke = ""
                    });
                    // End setup autocomplete ketika mode ttd canvas
                },
                addCanvasListeners(name, canvas) {
                    canvas.addEventListener('mousedown', (e) => this.startDraw(e, name));
                    canvas.addEventListener('mousemove', (e) => this.moveDraw(e, name));
                    canvas.addEventListener('mouseup', () => this.stopDraw(name));
                    canvas.addEventListener('mouseout', () => this.stopDraw(name));
                    canvas.addEventListener('touchstart', (e) => this.startDraw(e, name));
                    canvas.addEventListener('touchmove', (e) => this.moveDraw(e, name));
                    canvas.addEventListener('touchend', () => this.stopDraw(name));
                },
                getCoordinates(event, canvas) {
                    const rect = canvas.getBoundingClientRect();
                    if (event.touches) {
                        return { x: event.touches[0].clientX - rect.left, y: event.touches[0].clientY - rect.top };
                    }
                    return { x: event.offsetX, y: event.offsetY };
                },
                startDraw(event, name) {
                    event.preventDefault();
                    const canvas = this.$refs[name];
                    const drawing = this.drawings[name];
                    drawing.isDrawing = true;
                    const { x, y } = this.getCoordinates(event, canvas);
                    drawing.lastX = x;
                    drawing.lastY = y;
                },
                moveDraw(event, name) {
                    const canvas = this.$refs[name];
                    const drawing = this.drawings[name];
                    if (!drawing.isDrawing) return;
                    event.preventDefault();
                    const ctx = canvas.getContext('2d');
                    ctx.lineWidth = drawing.brushSize;
                    ctx.strokeStyle = drawing.isErasing ? 'rgba(255, 255, 255, 1)' : drawing.brushColor;
                    ctx.globalCompositeOperation = drawing.isErasing ? 'destination-out' : 'source-over';
                    ctx.lineJoin = 'round';
                    ctx.lineCap = 'round';

                    const { x, y } = this.getCoordinates(event, canvas);
                    ctx.beginPath();
                    ctx.moveTo(drawing.lastX, drawing.lastY);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    drawing.lastX = x;
                    drawing.lastY = y;
                },
                stopDraw(name) {
                    this.drawings[name].isDrawing = false;
                },
                startDrawing(name) {
                    this.drawings[name].isErasing = false;
                },
                startErasing(name) {
                    this.drawings[name].isErasing = true;
                },
                clearCanvas(name, showConfirm = true) {
                    if (showConfirm) {
                        Swal.fire({
                            title: "Apa kamu yakin?",
                            text: "Anda tidak akan dapat mengembalikan ini!",
                            icon: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#3085d6",
                            cancelButtonColor: "#d33",
                            confirmButtonText: "Ya, hapus!"
                        }).then((result) => {
                            if (result.isConfirmed || result.value) {
                                setByPath(this, this.tmp_modal_ttd.path_stroke, "");
                                const canvas = this.$refs[name];
                                const ctx = canvas.getContext('2d');
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                Swal.fire({
                                    icon: "success",
                                    title: "Coretan Anda telah dihapus",
                                    showConfirmButton: false,
                                    timer: 1000
                                });
                            }
                        });
                    } else {
                        const canvas = this.$refs[name];
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                },
                saveAsImage({ name, path_name, path_stroke, isReturn = false }) {
                    if (this.tmp_modal_ttd.mode_ttd === "QRCODE") {
                        if (isReturn) return generatorQr(this.drawer_ttd[name].name);
                        else setByPath(this, path_stroke, generatorQr(getByPath(this, path_name)));
                    } else if (this.tmp_modal_ttd.mode_ttd === "CANVAS") {
                        const scaleFactor = 1; // Faktor skala, bisa diatur sesuai kebutuhan
                        const drawingCanvas = this.$refs[name];

                        // Buat canvas baru untuk menampung hasil
                        const resizedCanvas = document.createElement("canvas");
                        resizedCanvas.width = drawingCanvas.width * scaleFactor;
                        resizedCanvas.height = drawingCanvas.height * scaleFactor;

                        const resizedCtx = resizedCanvas.getContext("2d");

                        // Skalakan gambar latar belakang dan coretan ke canvas yang lebih kecil
                        resizedCtx.drawImage(drawingCanvas, 0, 0, resizedCanvas.width, resizedCanvas.height);

                        // Konversi hasilnya menjadi PNG base64
                        const resizedBase64 = resizedCanvas.toDataURL("image/png");

                        // Menyimpan hasil base64 ke array `drawings`
                        if (isReturn) return resizedBase64;
                        else setByPath(this, path_stroke, resizedBase64);
                    }
                },
                // Fungsi untuk memuat gambar dari base64 ke canvas
                loadBase64Image(base64 = null) {
                    const drawingCanvas = this.$refs["ttd_1"];
                    const drawingCtx = drawingCanvas.getContext("2d");

                    const drawingImage = new Image();
                    drawingImage.src = base64; // Muat gambar dari base64 di array drawings

                    drawingImage.onload = () => {
                        drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                        drawingCtx.drawImage(drawingImage, 0, 0, drawingCanvas.width, drawingCanvas.height);
                    };
                },
                openTTDModalHandler: function ({ path_name = "", path_stroke = "", mode_ttd = "", label = "Penandatangan", name_input_type = "TEXT" }) {
                    this.clearCanvas('ttd_1', false);
                    this.tmp_modal_ttd.name = "";
                    const stroke = getByPath(this, path_stroke);


                    this.tmp_modal_ttd.name = getByPath(this, path_name);
                    this.tmp_modal_ttd.name_input_type = name_input_type;
                    this.tmp_modal_ttd.label = label;
                    this.tmp_modal_ttd.path_name = path_name;
                    this.tmp_modal_ttd.path_stroke = path_stroke;
                    this.tmp_modal_ttd.mode_ttd = mode_ttd;

                    if (stroke || this.tmp_modal_ttd.name) this.tmp_modal_ttd.mode = "edit";
                    else this.tmp_modal_ttd.mode = "add";

                    if (this.tmp_modal_ttd.mode === "add") {
                        this.tmp_modal_ttd.title = "Tambah Tanda Tangan";
                    } else if (this.tmp_modal_ttd.mode === "edit") {
                        setSelect2("#dokter_ttd_modal_auto", this.tmp_modal_ttd.name, this.tmp_modal_ttd.name);
                        this.tmp_modal_ttd.title = "Edit Tanda Tangan";
                        this.loadBase64Image(getByPath(this, path_stroke));
                    }
                },
                saveTTDHandler: function (isAutoComplete = false) {
                    console.log(isAutoComplete);
                    const drawingCanvas = this.$refs['ttd_1'];

                    setByPath(this, this.tmp_modal_ttd.path_name, this.tmp_modal_ttd.name);

                    if (!isCanvasBlank(drawingCanvas) || this.tmp_modal_ttd.mode_ttd === 'QRCODE') {
                        this.saveAsImage({ name: 'ttd_1', path_name: this.tmp_modal_ttd.path_name, path_stroke: this.tmp_modal_ttd.path_stroke });
                    }

                    this.tmp_modal_ttd = {
                        name: "",
                        title: "",
                        label: "",
                        mode: "",
                        mode_ttd: "",
                        path_name: "",
                        path_stroke: "",
                        name_input_type: ""
                    };
                },
                checkData: function () {
                    /* built in function from edoc */
                    preview_emr_data(data);
                },
                onChDateDynamic: function (dateData, jsonPath) {
                    let obj = this
                    jsonPathSplit = jsonPath.split('.');
                    for (i = 0; i < jsonPathSplit.length - 1; i++) {
                        obj = obj[jsonPathSplit[i]];
                    }
                    if (dateData.target.value != "") {
                        obj[jsonPathSplit[i]] = dateParse(new Date(dateData.target.value));
                    } else {
                        obj[jsonPathSplit[i]] = "";
                    }
                },
                add_diagnosa: function () {
                    this.list_diagnosa.push(...DIAGNOSA_TMP)
                },
                del_diagnosa: function (i) {
                    if (i > -1) {
                        this.list_diagnosa.splice(i, 1);
                    }
                },
                add_tindakan: function () {
                    this.tindakan.push(...TINDAKAN_TMP)
                },
                del_tindakan: function (i) {
                    if (i > -1) {
                        this.tindakan.splice(i, 1);
                    }
                },
                saveTindakanUtama: function () {
                    let no = 1;
                    let hasilString = "";

                    data.external_link.tindakan_data.forEach((x, i) => {
                        if (this.indexExpandTindakanUtama[i][0].selected === true) {
                            const tindak = data.external_link.tindakan_data[i];
                            hasilString += `${no}. ${tindak.id_layanan_pendaftaran} - ${tindak.nama_layanan.replace(/<\/?[^>]+(>|$)/g, "")}\n`;
                            no++;
                        }
                    });

                    // Solusi 1: Pakai $set
                    this.tindakan_freetext = hasilString;

                    $("#hasilTindakanModal").modal("toggle");
                },
            }
        });
    }

    function generatorQr(el) {
        let elgenerateqr = document.createElement('div');
        elgenerateqr.id = "elgenerateqr";

        let objqrcode = new QRCode(elgenerateqr, el);
        return elgenerateqr.querySelector('canvas').toDataURL();
    }

    function getByPath(obj, path) {
        return path
            .replace(/\[(\d+)\]/g, '.$1')      // Ubah [0] jadi .0
            .split('.')                        // Pisahkan dengan titik
            .reduce((acc, part) => acc && acc[part], obj);
    }

    function setByPath(obj, path, value) {
        const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
        let current = obj;

        for (let i = 0; i < parts.length - 1; i++) {
            const part = parts[i];
            if (!(part in current)) {
                // otomatis buat objek/array baru jika belum ada
                current[part] = isNaN(Number(parts[i + 1])) ? {} : [];
            }
            current = current[part];
        }

        current[parts[parts.length - 1]] = value;
    }

    function isCanvasBlank(canvas) {
        const context = canvas.getContext('2d');
        const pixelBuffer = new Uint32Array(
            context.getImageData(0, 0, canvas.width, canvas.height).data.buffer
        );

        return !pixelBuffer.some(color => color !== 0);
    };

    function getUrlHandler() {
        return window.location.hostname === IP_WG
            ? URL_IMAGE_SEVER_WG
            : URL_IMAGE_SEVER_LOCAL;
    }

        console.log("px data : ", ext_px_data)

        data.pasien.tanggal_lahir_indo = dateParse(new Date(ext_px_data.tanggal_lahir))
        data.pasien.nama = ext_px_data.nama
        data.pasien.no_rm = ext_px_data.no_rm
        data.pasien.kelamin = ext_px_data.kelamin
        data.pasien.nik = ext_px_data.no_identitas

        // console.log(data.pasien.tanggal_lahir_indo)

        //Bridging DPJP
        const dpjp = data.external_link.dokter_dpjp_data.nama_dokter_dpjp
        data.ttd.dokter_ttd = data.external_link.dokter_dpjp_data.nama_dokter_dpjp
        setSelect2($('#dokter_auto'), dpjp, dpjp)

        //Bridging Kelas
        data.pasien.kelas = data.external_link.inpatient_information.nama_kelas || "Non Kelas"

        //Bridging Anamnesa / Keluhan Utama
        const ext_vital_sign_data = data.external_link.vital_sign_data
        data.anamnesa = ext_vital_sign_data.keluhan_utama || ""

        //Bridging Pemriksaan FIsik dan TTV
        const ttv = data.pemeriksaan_fisik.ttv
        ttv.tensi.sistole = ext_vital_sign_data.tensi.sistole || 0
        ttv.tensi.diastole = ext_vital_sign_data.tensi.diastole || 0
        ttv.nadi = ext_vital_sign_data.nadi || 0
        ttv.nafas = ext_vital_sign_data.nafas || 0
        ttv.suhu = ext_vital_sign_data.suhu || 0
        ttv.tb = ext_vital_sign_data.tinggi_badan || 0
        ttv.bb = ext_vital_sign_data.berat_badan || 0
        data.pemeriksaan_fisik.keterangan = ext_vital_sign_data.pemeriksaan_fisik || ""

        //bridging Diagnosa All
        if (data.external_link.diagnosa_data[0].nama_sebab_sakit != "") {
            data.list_diagnosa = data.external_link.diagnosa_data;
        }

        //bridigin Tindakan ALl
        // const tindakan_data = data.external_link.tindakan_data
        // if(tindakan_data[0].nama_layanan != ""){
        //     var tindakan_new = tindakan_data.map(val => {
        //         var data_test = {layanan: val.nama_layanan}

        //         return data_test
        //     });
        //     data.tindakan = tindakan_new
        // }

        //Bridging Resep
        const prescription_data = data.external_link.prescription_data

        var resep_rs = prescription_data.filter(function (el) {
            return el.status_obat_pulang == "" || el.status_obat_pulang == "Tidak";
        });

        // console.log(resep_rs.length)
        // -------------------------
        if (resep_rs.length > 1) {
            if (resep_rs[0].resep.length != 0) {
                //resep RS
                var newResepRS = resep_rs.reverse();
                var data_resep_rs = newResepRS?.map(obj => obj.resep.map(el => {
                    const container = {};
                    container.data_resep = `R/${el.r_no} - ${el.nama_pendek} ${el.kekuatan} ${el.nama_kekuatan} ${el.nama_satuan},\n`;

                    return container;
                }));
                var data_resep_rs_view = data_resep_rs.map(val => val.map(vul => vul.data_resep));

                data.terapi = data_resep_rs_view[0].join(' ') || "";
                // console.error("test")
            } else if (resep_rs[1].resep.length != 0) {
                //resep RS
                var newResepRS = resep_rs.reverse()
                var data_resep_rs = newResepRS?.map(obj => obj.resep.map(el => {
                    const container = {};
                    container.data_resep = `R/${el.r_no} - ${el.nama_pendek} ${el.kekuatan} ${el.nama_kekuatan} ${el.nama_satuan},\n`;

                    return container;
                }));
                var data_resep_rs_view = data_resep_rs.map(val => val.map(vul => vul.data_resep));

                data.terapi = data_resep_rs_view[0].join(' ') || "";
            } else {
                data.terapi = "";
            }
        } else {
            data.terapi = "";
        }

        // console.log(data.terapi);


    }

    function auto_grow(element) { //function yang digunakan untuk auto-grow height textarea
        // element.style.height = "5px";
        // element.style.height = (element.scrollHeight)+"px";
    }

    function init_doc_edit(data) {
        bridgingTindakan(data);
        setSelect2($('#dokter_auto1'), data.ttd_data.dokter, data.ttd_data.dokter)
        setSelect2($('#nakes_auto1'), data.ttd_data.perawat, data.ttd_data.perawat)

        data.ttd.tanggal_ttd_perawat_indo = dateParse(new Date(data.ttd.tanggal_ttd_perawat))
        data.ttd.jam_ttd_perawat = data.ttd.jam_ttd_perawat

        data.ttd.tanggal_ttd_dokter = data.ttd.tanggal_ttd_dokter
        data.ttd.tanggal_ttd_dokter_indo = dateParse(new Date(data.ttd.tanggal_ttd_dokter))
        data.ttd.jam_ttd_dokter = data.ttd.jam_ttd_dokter

        const ext_px_data = data.external_link.px_data
        // console.log("edit ", dateParse(new Date(ext_px_data.tanggal_lahir)))
        data.pasien.tanggal_lahir_indo = dateParse(new Date(ext_px_data.tanggal_lahir))

        // data.pasien.tanggal_lahir_indo = dateParse(new Date(ext_px_data.tanggal_lahir))

        auto_grow($('#terapi'))
    }

    function bridgingTindakan(data) {
        // Jika hanya ada satu data tindakan
        if (data.external_link.tindakan_data.length === 1) {
            let hasil_tindakan = "";
            data.external_link.tindakan_data.map((v, i) => {
                hasil_tindakan += `${i + 1}. ${v.id_layanan_pendaftaran} - ${v.nama_layanan}\n`;
            });

            // Simpan hasil tindakan
            data.tindakan_freetext = data.tindakan_freetext || hasil_tindakan;
        }
    }

    function setupIndexExpand(data, indexExpand, external_link_name, with_layanan = true) {

        let indexExpandTmp = data.external_link[external_link_name].map((v, i) => {
            if (with_layanan) {
                return v.layanan.map((x, j) => ({ "expand": false, "selected": false }))
            } else {
                return [{ "expand": false, "selected": false }]
            }
        })

        for (let i = 0; i < indexExpandTmp.length; i++) {
            if (data[indexExpand][i] === undefined || data[indexExpand][i].length === 0) {
                data[indexExpand][i] = indexExpandTmp[i];
            } else {
                for (let j = 0; j < indexExpandTmp[i].length; j++) {
                    if (data[indexExpand][i][j] === undefined) {
                        data[indexExpand][i][j] = indexExpandTmp[i][j];
                    }
                }
            }
        }
    }

                    </div>
                </div>
            </div>
        </div>

        <!--================================================================-->
        <hr style="height:1px;border-width:0;color:gray;background-color:gray">
        <!--================================================================-->

        <!-- baris tanda tangan-->
        <div class="form-group">
            <div class="form-group row">
                <div class="col-md-6">
                    <div class="form-group row">
                        <label for="tanggal_ttd_dokter" class="col-sm-3 col-form-label">Tanggal </label>
                        <div class="col-sm-7">
                            <input type="date" class="form-control" id="tanggal_ttd_dokter"
                                placeholder="tanggal_ttd_dokter"
                                @change="onChDateDynamic($event, 'ttd.tanggal_ttd_dokter_indo')"
                                v-model="ttd.tanggal_ttd_dokter">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="jam_ttd_dokter" class="col-sm-3 col-form-label">Pukul</label>
                        <div class="col-sm-7">
                            <input type="time" class="form-control" id="jam_ttd" v-model="ttd.jam_ttd_dokter">
                        </div>
                    </div>

                    <br />
                    <div align="right" class="mt-1">
                        <ttd-section mode="IMAGE" label="Dokter" select_id="dokter_auto1" name_input_type="DOKTER"
                            v-model="ttd_data.dokter" path_name="ttd_data.dokter" :stroke="ttd_data.dokter_stroke"
                            path_stroke="ttd_data.dokter_stroke" @update-stroke="ttd_data.dokter_stroke = $event"
                            @open-ttd-modal="openTTDModalHandler" />
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group row">
                        <label for="tanggal_ttd_perawat" class="col-sm-3 col-form-label">Tanggal </label>
                        <div class="col-sm-7">
                            <input type="date" class="form-control" id="tanggal_ttd_perawat" placeholder="tanggal_ttd"
                                @change="onChDateDynamic($event, 'ttd.tanggal_ttd_perawat_indo')"
                                v-model="ttd.tanggal_ttd_perawat">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="jam_ttd_perawat" class="col-sm-3 col-form-label">Pukul</label>
                        <div class="col-sm-7">
                            <input type="time" class="form-control" id="jam_ttd_perawat" v-model="ttd.jam_ttd_perawat">
                        </div>
                    </div>

                    <br />
                    <div align="right" class="mt-1">
                        <ttd-section mode="IMAGE" label="Perawat" select_id="nakes_auto1" name_input_type="NAKES"
                            v-model="ttd_data.perawat" path_name="ttd_data.perawat" :stroke="ttd_data.perawat_stroke"
                            path_stroke="ttd_data.perawat_stroke" @update-stroke="ttd_data.perawat_stroke = $event"
                            @open-ttd-modal="openTTDModalHandler" />
                    </div>
                </div>
            </div>
        </div>
        <!-- baris tanda tangan-->


        <div class="form-group row mt-5 text-center">
            <div class="col-md-12">
                <button type="button" v-on:click="saveDoc" class="btn btn-primary"><i class="fa fa-save"></i>
                    Simpan</button>
                <button type="button" v-on:click="checkData" class="btn btn-success prod_hidden"><i
                        class="fa fa-check-square-o"></i> Check Data</button>
            </div>
        </div>

        <!-- START MODAL TTD -->
        <div class="modal fade" id="tandaTanganModal" tabindex="-1" aria-labelledby="tandaTanganModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="tandaTanganModalLabel">{{ tmp_modal_ttd.title }}</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <div class="row text-center d-block mb-2">{{ tmp_modal_ttd.label }}</div>
                                <div class="row">
                                    <div class="col-md-12 p-0 d-flex justify-content-center">
                                        <div style="width: 65%;" class="d-flex justify-content-between">
                                            <div>
                                                <div style="display: inline; margin-right: 10px">
                                                    <input type="color" style="width: 30px"
                                                        v-model="drawings.ttd_1.brushColor" />
                                                </div>
                                                <div style="display: inline; margin-right: 10px; margin-top: 5px">
                                                    <input type="range" min="1" max="20"
                                                        v-model="drawings.ttd_1.brushSize" />
                                                    <span>{{ drawings.ttd_1.brushSize }}</span>
                                                </div>
                                            </div>
                                            <div style="display: inline">
                                                <button type="button" @click="startDrawing('ttd_1')"
                                                    class="btn btn-outline-info btn-sm" data-bs-toggle="tooltip"
                                                    data-bs-placement="left" title="Drawing">
                                                    <i class="fa fa-paint-brush"></i>
                                                </button>
                                                <button type="button" title="Erasing" @click="startErasing('ttd_1')"
                                                    class="btn btn-outline-secondary btn-sm" data-bs-toggle="tooltip"
                                                    data-bs-placement="left">
                                                    <i class="fa fa-eraser"></i>
                                                </button>
                                                <button type="button" title="Clear All" @click="clearCanvas('ttd_1')"
                                                    class="btn btn-outline-danger btn-sm" data-bs-toggle="tooltip"
                                                    data-bs-placement="left">
                                                    <i class="fa fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-12 d-flex justify-content-center">
                                        <canvas ref="ttd_1" id="ttd_1" width="180" height="100"
                                            style="border: 1px solid black; margin-right: 3px"></canvas>
                                    </div>
                                </div>
                                <div class="row mt-2 justify-content-center">
                                    <div class="col-md-12 p-0 d-flex justify-content-center">
                                        <div v-if="tmp_modal_ttd.name_input_type === 'TEXT'" style="width: 65%;"
                                            class="d-flex justify-content-center">
                                            <input :key="'input_text'" type="text" class="form-control"
                                                v-model="tmp_modal_ttd.name" />
                                        </div>
                                        <div v-if="tmp_modal_ttd.name_input_type === 'DOKTER'" style="width: 65%;">
                                            <select :key="'input_dokter'" class="form-control"
                                                id="dokter_ttd_modal_auto" style="width: 100%"></select>
                                        </div>
                                        <div v-if="tmp_modal_ttd.name_input_type === 'NAKES'" style="width: 65%;">
                                            <select :key="'input_nakes'" class="form-control" id="nakes_ttd_modal_auto"
                                                style="width: 100%"></select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Tutup</button>
                        <button type="button" class="btn btn-primary" data-dismiss="modal"
                            @click="saveTTDHandler(true)">Simpan</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- END MODAL TTD -->


        <!--START TINDAKAN MODAL-->
        <div class="modal fade" id="hasilTindakanModal" tabindex="-1" role="dialog"
            aria-labelledby="hasilTindakanModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Hasil Tindakan Utama</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div>
                            <!--Modal Loop Tindakan -->
                            <div v-for="(tindakanItem, i) in external_link.tindakan_data" :key="i"
                                class="mb-2 px-3 py-2 rounded border-bottom font-weight-bold d-flex justify-content-between align-items-center tindakan-item"
                                :class="{
                            'bg-primary text-white': indexExpandTindakanUtama[i][0].selected,
                            'bg-light': !indexExpandTindakanUtama[i][0].selected
                        }" @click="indexExpandTindakanUtama[i][0].selected = !indexExpandTindakanUtama[i][0].selected">
                                <div class="nav-link mb-0">
                                    <strong>{{ i + 1 }}.</strong>
                                    {{ tindakanItem.id_layanan_pendaftaran }} - {{ tindakanItem.nama_layanan }}
                                </div>
                                <div>
                                    <div class="custom-control custom-checkbox">
                                        <input type="checkbox" class="custom-control-input"
                                            :id="'customCheckTindakanUtama'+i"
                                            :checked="indexExpandTindakanUtama[i][0].selected"
                                            @change="indexExpandTindakanUtama[i][0].selected = !indexExpandTindakanUtama[i][0].selected" />

                                        <label class="custom-control-label" :for="'customCheckTindakanUtama'+i"></label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" @click="saveTindakanUtama">Save changes</button>
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
        <!--END TINDAKAN MODAL-->
    </form>
</div>
